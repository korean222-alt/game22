<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<!-- viewport-fit=cover lets the canvas run under the notch; the CSS then pulls
     the UI back inside with env(safe-area-inset-*). -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#15171c">
<meta name="color-scheme" content="dark">
<meta name="description" content="사장이 되어 소셜게임 회사를 키우는 3D 경영 시뮬레이션. 기획서를 뽑고, 아이디어와 싸워 게임을 만들고, 출시해서 유저를 모으세요.">

<!-- iOS standalone: no Safari chrome once added to the home screen -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="소셜게임 스토리 3D">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="icon" href="./icons/icon-192.png" sizes="192x192">
<link rel="manifest" href="./manifest.webmanifest">

<title>소셜게임 스토리 3D</title>
<link rel="stylesheet" href="./src/ui/style.css">
</head>
<body>
<canvas id="gl"></canvas>
<div id="ov"></div>

<div id="boot">
  <div class="sp"></div>
  <div class="bt">사무실을 짓는 중…</div>
  <div class="bs" id="bootStep">렌더러 준비</div>
</div>

<!-- Shown until the device is held in landscape. A phone-sized portrait window
     cannot fit the office and the panel at once, so the game waits. -->
<div id="rotate">
  <div class="ph"><div class="phi"></div></div>
  <div class="rt">가로로 돌려주세요</div>
  <div class="rs">이 게임은 가로 모드 전용입니다</div>
</div>

<!-- ══ top HUD: 랭크 · 스태미나 · 자금 · 코인 · 날짜 ══ -->
<div id="hud" class="card">
  <div class="hz"><span class="hk">RANK</span><b id="hRank">1</b></div>
  <div class="hz"><span class="hk">STAM</span><b id="hStam">8</b><i id="hStamMax">/8</i></div>
  <div class="hz money"><span class="hi">💵</span><b id="hMoney">0</b></div>
  <div class="hz coins"><span class="hi">🪙</span><b id="hCoins">0</b></div>
  <div class="hz fans"><span class="hk">팬</span><b id="hFans">0</b></div>
  <div class="hz date" id="hDate">1년차 1월 1주</div>
</div>

<div id="brand" class="card">
  <div class="k">SOCIAL DEV STORY</div>
  <h1>소셜게임 스토리 <em>3D</em></h1>
  <div class="s" id="coName">스튜디오 게임22</div>
</div>

<!-- panel show/hide, and fullscreen -->
<button id="menuBtn" class="iconbtn" aria-label="패널 열기/닫기"><span></span><span></span><span></span></button>
<button id="fsBtn" class="iconbtn" aria-label="전체화면">⛶</button>

<!-- ══ floor selector ══ -->
<div id="floors"></div>

<!-- ══ side panel ══ -->
<div id="side" class="card">
  <div id="tabs">
    <div class="tab on" data-tab="company">회사</div>
    <div class="tab" data-tab="staff">직원</div>
    <div class="tab" data-tab="dev">개발</div>
    <div class="tab" data-tab="live">운영</div>
    <div class="tab" data-tab="log">기록</div>
  </div>
  <div id="panel"></div>
</div>

<!-- ══ development battle bar ══ -->
<div id="battle" class="card">
  <div class="bhead">
    <span class="bt2" id="bTitle">—</span>
    <span class="bmeta" id="bMeta"></span>
  </div>
  <div class="hpwrap"><div class="hpbar" id="bHp"></div><span class="hptx" id="bHpTx"></span></div>
  <div class="brow">
    <button class="btn primary" id="bTurn">개발 진행</button>
    <button class="btn" id="bAuto">자동</button>
    <span class="bcost" id="bCost"></span>
  </div>
</div>

<!-- ══ modal: idea cards, release, rank up ══ -->
<div id="modal">
  <div class="mc card">
    <div class="mtag" id="mTag">아이디어</div>
    <h3 id="mTitle">—</h3>
    <div id="mBody"></div>
    <div id="mOpts"></div>
    <div class="mok" id="mOk">확인</div>
  </div>
</div>

<div id="toast" class="card"></div>
<div id="hint">한 손가락 회전 · 두 손가락 확대 · 층 버튼으로 이동</div>

<script type="module" src="./src/main.js"></script>
<script>
  // Registered outside the module graph so a service-worker failure can never
  // stop the game itself from booting.
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
